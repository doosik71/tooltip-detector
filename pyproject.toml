[project]
name = "tooltip-detector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "albumentations>=2.0.8",
    "pillow>=12.2.0",
    "torch>=2.7.1",
    "torchvision==0.22.1",
    "tqdm>=4.70.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
]
