  <line x1="546.7" y1="418" x2="546.7" y2="422" stroke="#8b95a3"/>
  <text x="546.7" y="436" class="t ax" text-anchor="middle">80</text>
  <line x1="653.3" y1="418" x2="653.3" y2="422" stroke="#8b95a3"/>
  <text x="653.3" y="436" class="t ax" text-anchor="middle">100</text>
  <line x1="760.0" y1="418" x2="760.0" y2="422" stroke="#8b95a3"/>
  <text x="760.0" y="436" class="t ax" text-anchor="middle">120</text>
  <line x1="120" y1="300" x2="120" y2="418" stroke="#8b95a3" stroke-width="1.2"/>
  <line x1="120" y1="418" x2="760" y2="418" stroke="#8b95a3" stroke-width="1.2"/>
  <text x="440" y="454" class="t ax" text-anchor="middle">팁으로부터의 거리 (px)</text>
  <text x="112" y="290" class="t ax" text-anchor="end">타겟값</text>
  <line x1="120" y1="359.0" x2="760" y2="359.0" stroke="#ac4b45" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="768" y="363.0" class="t an" fill="#ac4b45" font-weight="700">임계값 0.5</text>
  <polygon points="120.0,300.0 760.0,388.5 760.0,418.0 440.0,418.0" fill="#c4763a" fill-opacity="0.18"/>
  <polyline points="120.0,300.0 653.3,418.0 760.0,418.0" fill="none" stroke="#c4763a" stroke-width="2" stroke-dasharray="6 3"/>
  <polyline points="120.0,300.0 130.7,301.0 141.3,304.1 152.0,309.1 162.7,315.6 173.3,323.5 184.0,332.3 194.7,341.7 205.3,351.2 216.0,360.6 226.7,369.5 237.3,377.7 248.0,385.2 258.7,391.7 269.3,397.3 280.0,402.0 290.7,405.9 301.3,409.0 312.0,411.4 322.7,413.2 333.3,414.6 344.0,415.7 354.7,416.4 365.3,416.9 376.0,417.3 386.7,417.5 397.3,417.7 408.0,417.8 418.7,417.9 429.3,417.9 440.0,418.0 450.7,418.0 461.3,418.0 472.0,418.0 482.7,418.0 493.3,418.0 504.0,418.0 514.7,418.0 525.3,418.0 536.0,418.0 546.7,418.0 557.3,418.0 568.0,418.0 578.7,418.0 589.3,418.0 600.0,418.0 610.7,418.0 621.3,418.0 632.0,418.0 642.7,418.0 653.3,418.0 664.0,418.0 674.7,418.0 685.3,418.0 696.0,418.0 706.7,418.0 717.3,418.0 728.0,418.0 738.7,418.0 749.3,418.0 760.0,418.0" fill="none" stroke="#2f6f9f" stroke-width="2.2"/>
  <line x1="214.2" y1="359.0" x2="214.2" y2="418" stroke="#2f6f9f" stroke-width="1" stroke-dasharray="3 2"/>
  <circle cx="214.2" cy="359.0" r="3.6" fill="#2f6f9f"/>
  <text x="220.2" y="351.0" class="t an" fill="#2f6f9f" font-weight="700">17.7 px</text>
  <line x1="280.0" y1="359.0" x2="280.0" y2="418" stroke="#c4763a" stroke-width="1" stroke-dasharray="3 2"/>
  <circle cx="280.0" cy="359.0" r="3.2" fill="#c4763a"/>
  <line x1="386.7" y1="359.0" x2="386.7" y2="418" stroke="#c4763a" stroke-width="1" stroke-dasharray="3 2"/>
  <circle cx="386.7" cy="359.0" r="3.2" fill="#c4763a"/>
  <line x1="546.7" y1="359.0" x2="546.7" y2="418" stroke="#c4763a" stroke-width="1" stroke-dasharray="3 2"/>
  <circle cx="546.7" cy="359.0" r="3.2" fill="#c4763a"/>
  <text x="280.0" y="349.0" class="t an" fill="#c4763a" text-anchor="middle">30</text>
  <text x="386.7" y="349.0" class="t an" fill="#c4763a" text-anchor="middle">50</text>
  <text x="546.7" y="349.0" class="t an" fill="#c4763a" text-anchor="middle">80 px</text>
  <text x="418.7" y="323.6" class="t an" fill="#c4763a">L = 60–160 px 범위</text>
  <line x1="600" y1="292" x2="626" y2="292" stroke="#2f6f9f" stroke-width="2.2"/>
  <text x="632" y="296" class="t ax"><tspan class="m" font-size="9.5">gaussian-tip</tspan></text>
  <line x1="740" y1="292" x2="766" y2="292" stroke="#c4763a" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="772" y="296" class="t ax"><tspan class="m" font-size="9.5">gradient-seg</tspan></text>
  <rect x="24" y="458" width="164" height="86" rx="6" fill="#f5f7fa" stroke="#ccd4de"/>
  <text x="106" y="476" class="t cn" text-anchor="middle">Miss율</text>
