  <text x="174" y="500" class="t cv" fill="#2f6f9f" text-anchor="end">5.55 %</text>
  <text x="38" y="514" class="t cs">gradient-seg</text>
  <text x="174" y="514" class="t cs" text-anchor="end">gaussian-tip</text>
  <line x1="38" y1="522" x2="174" y2="522" stroke="#ccd4de"/>
  <text x="106" y="536" class="t cs" fill="#c4763a" font-weight="700" text-anchor="middle">우세: gradient-seg</text>
  <rect x="196" y="458" width="164" height="86" rx="6" fill="#f5f7fa" stroke="#ccd4de"/>
  <text x="278" y="476" class="t cn" text-anchor="middle">프레임 완전 실패율</text>
  <text x="210" y="500" class="t cv" font-size="12" fill="#c4763a">3.0–4.5 %</text>
  <text x="346" y="500" class="t cv" font-size="12" fill="#2f6f9f" text-anchor="end">6.5–7.6 %</text>
  <text x="210" y="514" class="t cs">gradient-seg</text>
  <text x="346" y="514" class="t cs" text-anchor="end">gaussian-tip</text>
  <line x1="210" y1="522" x2="346" y2="522" stroke="#ccd4de"/>
  <text x="278" y="536" class="t cs" fill="#c4763a" font-weight="700" text-anchor="middle">우세: gradient-seg</text>
  <rect x="368" y="458" width="164" height="86" rx="6" fill="#f5f7fa" stroke="#ccd4de"/>
  <text x="450" y="476" class="t cn" text-anchor="middle">Hit@10 px</text>
  <text x="382" y="500" class="t cv" fill="#c4763a">36.75 %</text>
  <text x="518" y="500" class="t cv" fill="#2f6f9f" text-anchor="end">68.26 %</text>
  <text x="382" y="514" class="t cs">gradient-seg</text>
  <text x="518" y="514" class="t cs" text-anchor="end">gaussian-tip</text>
  <line x1="382" y1="522" x2="518" y2="522" stroke="#ccd4de"/>
  <text x="450" y="536" class="t cs" fill="#2f6f9f" font-weight="700" text-anchor="middle">우세: gaussian-tip</text>
  <rect x="540" y="458" width="164" height="86" rx="6" fill="#f5f7fa" stroke="#ccd4de"/>
