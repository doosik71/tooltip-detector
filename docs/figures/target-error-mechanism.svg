  <line x1="514" y1="136" x2="664" y2="136" stroke="#c4763a" stroke-width="1.2"/>
  <line x1="514" y1="132" x2="514" y2="140" stroke="#c4763a" stroke-width="1.2"/>
  <line x1="664" y1="132" x2="664" y2="140" stroke="#c4763a" stroke-width="1.2"/>
  <text x="670" y="140" class="t an" fill="#c4763a" font-weight="700">≈ L / 2</text>
  <text x="726" y="118" class="t an">L = 팁에서 그룹 내 최원 화소까지</text>
  <line x1="514" y1="152" x2="589" y2="152" stroke="#8b95a3" stroke-width="1.2"/>
