<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-label="gaussian-tip과 gradient-seg의 초과-임계 영역 차이와 그 결과인 정밀도 대 miss율 트레이드오프">
  <style>
    .t{font-family:'Noto Sans CJK KR','NanumGothic','Noto Sans CJK JP',sans-serif}
    .m{font-family:'D2Coding','DejaVu Sans Mono',monospace}
    .ph{font-size:13px;font-weight:700}
    .bl{font-size:10.5px;fill:#17202e}
    .an{font-size:10px;fill:#5c6675}
    .ax{font-size:10px;fill:#8b95a3}
    .cn{font-size:10.5px;font-weight:700;fill:#17202e}
    .cv{font-size:14px;font-weight:700}
    .cs{font-size:9.5px;fill:#8b95a3}
  </style>
  <defs>
    <marker id="f5a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0 0 L10 4 L0 8 z" fill="#5c6675"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="#ffffff"/>
  <rect x="24" y="30" width="414" height="216" rx="6" fill="#fdfdfe" stroke="#ccd4de"/>
  <text x="40" y="53" class="t ph m" fill="#2f6f9f">gaussian-tip</text>  <text x="152" y="53" class="t an">(σ = 15 px, 마스크 미사용)</text>
  <polygon points="76,105 376,96 376,124 76,115" fill="#d3dae2" stroke="#b3bcc7"/>
  <circle cx="76" cy="110" r="26.5" fill="#2f6f9f" fill-opacity="0.82" stroke="#2f6f9f"/>
  <circle cx="76" cy="110" r="2.6" fill="#ffffff"/>
  <line x1="76" y1="110" x2="102.5" y2="110" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="2 2"/>
  <text x="106" y="152" class="t an" fill="#2f6f9f" font-weight="700">반경 17.7 px</text><line x1="103" y1="146" x2="92" y2="126" stroke="#2f6f9f" stroke-width="1"/>
  <line x1="196" y1="82" x2="98" y2="96" stroke="#5c6675" stroke-width="1" marker-end="url(#f5a)"/>
  <text x="202" y="80" class="t an">값 ≥ 0.5 영역 — 팁 중심 원판</text>
  <text x="290" y="132" class="t an">도구 마스크 (타겟 생성에 쓰이지 않음)</text>
  <line x1="196" y1="152" x2="271" y2="152" stroke="#8b95a3" stroke-width="1.2"/>
  <line x1="196" y1="148" x2="196" y2="156" stroke="#8b95a3" stroke-width="1.2"/>
  <line x1="271" y1="148" x2="271" y2="156" stroke="#8b95a3" stroke-width="1.2"/>
  <text x="277" y="156" class="t ax">50 px</text>
  <text x="40" y="182" class="t bl">· 분할 마스크가 필요 없다 — 팁 좌표 하나로 생성된다.</text>
  <text x="40" y="201" class="t bl">· argmax가 팁에서 <tspan font-weight="700">최대 17.7 px</tspan> 안에 갇힌다 → 정밀도 ↑</text>
  <text x="40" y="220" class="t bl">· 응답이 0.5 아래로 내려가면 후보가 <tspan font-weight="700">통째로 사라진다</tspan> → miss ↑</text>
  <rect x="462" y="30" width="414" height="216" rx="6" fill="#fdfdfe" stroke="#ccd4de"/>
  <text x="478" y="53" class="t ph m" fill="#c4763a">gradient-seg</text>  <text x="590" y="53" class="t an">(마스크 형태에 따라 달라짐)</text>
  <polygon points="514,105 814,96 814,124 514,115" fill="#d3dae2" stroke="#b3bcc7"/>
