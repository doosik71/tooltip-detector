  <text x="554" y="500" class="t cv" fill="#c4763a">13.27 px</text>
  <text x="690" y="500" class="t cv" fill="#2f6f9f" text-anchor="end">4.92 px</text>
  <text x="554" y="514" class="t cs">gradient-seg</text>
  <text x="690" y="514" class="t cs" text-anchor="end">gaussian-tip</text>
  <line x1="554" y1="522" x2="690" y2="522" stroke="#ccd4de"/>
  <text x="622" y="536" class="t cs" fill="#2f6f9f" font-weight="700" text-anchor="middle">우세: gaussian-tip</text>
  <rect x="712" y="458" width="164" height="86" rx="6" fill="#f5f7fa" stroke="#ccd4de"/>
  <text x="794" y="476" class="t cn" text-anchor="middle">Hit@50 px</text>
  <text x="726" y="500" class="t cv" fill="#c4763a">80.95 %</text>
  <text x="862" y="500" class="t cv" fill="#2f6f9f" text-anchor="end">80.94 %</text>
  <text x="726" y="514" class="t cs">gradient-seg</text>
  <text x="862" y="514" class="t cs" text-anchor="end">gaussian-tip</text>
  <line x1="726" y1="522" x2="862" y2="522" stroke="#ccd4de"/>
  <text x="794" y="536" class="t cs" fill="#5c6675" font-weight="700" text-anchor="middle">우세: 대등</text>
  <text x="24" y="586" class="t an"><tspan font-weight="700">이 대비는 임계값 0.5 고정에서만 성립한다.</tspan> gaussian-tip의 높은 miss율은 좁은 초과-임계 영역의 직접적 결과이므로, 임계값을 0.3 정도로 낮추면 상당 부분 해소될 수 있다 (§8.3).</text>
</svg>