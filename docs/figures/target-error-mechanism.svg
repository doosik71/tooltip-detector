  <line x1="589" y1="148" x2="589" y2="156" stroke="#8b95a3" stroke-width="1.2"/>
  <text x="595" y="156" class="t ax">50 px</text>
  <text x="478" y="182" class="t bl">· 마스크 + 팁 + bbox 세 종류의 레이블이 필요하다.</text>
  <text x="478" y="201" class="t bl">· argmax가 <tspan font-weight="700">넓은 영역에서 방황한다</tspan> → 정밀도 ↓</text>
  <text x="478" y="220" class="t bl">· 영역이 넓어 일부라도 0.5를 넘길 확률이 높다 → miss ↓</text>
  <text x="24" y="278" class="t cn">팁으로부터의 거리에 따른 타겟값 — 임계값 0.5를 넘는 구간의 길이가 다르다</text>
  <line x1="120" y1="418.0" x2="760" y2="418.0" stroke="#e7ebf0"/>
