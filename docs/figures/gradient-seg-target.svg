<svg xmlns="http://www.w3.org/2000/svg" width="900" height="458" viewBox="0 0 900 458" role="img"
     aria-label="이진 분할 마스크로부터 거리 기반 히트맵을 생성하는 gradient-seg 타겟 생성 과정">
  <style>
    .t{font-family:'Noto Sans CJK KR','NanumGothic','Noto Sans CJK JP',sans-serif}
    .m{font-family:'D2Coding','DejaVu Sans Mono',monospace}
    .ph{font-size:12.5px;font-weight:700;fill:#17202e}
    .pn{font-size:10.5px;fill:#5c6675}
    .cc{font-size:9.5px;font-weight:700;fill:#ffffff}
    .ax{font-size:9px;fill:#8b95a3}
  </style>
  <defs>
    <marker id="g-ar" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
      <path d="M0 0 L10 4 L0 8 z" fill="#8b95a3"/>
    </marker>
    <marker id="g-arw" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="6" markerHeight="5" orient="auto">
      <path d="M0 0 L10 4 L0 8 z" fill="#17202e"/>
    </marker>
    <!-- 도구 A 그룹: 팁(74,72) → 그룹 내 최원점(-4.1,12.6) -->
    <linearGradient id="hmA" gradientUnits="userSpaceOnUse" x1="74" y1="72" x2="-4.1" y2="12.6">
      <stop offset="0" stop-color="#ffdd77"/><stop offset="0.5" stop-color="#3f7fa8"/><stop offset="1" stop-color="#252d3a"/>
    </linearGradient>
    <!-- 도구 B: 팁(100,92) → 최원점(148.5,19.6) -->
    <linearGradient id="hmB" gradientUnits="userSpaceOnUse" x1="100" y1="92" x2="148.5" y2="19.6">
      <stop offset="0" stop-color="#ffdd77"/><stop offset="0.5" stop-color="#3f7fa8"/><stop offset="1" stop-color="#252d3a"/>
    </linearGradient>
    <linearGradient id="cbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#252d3a"/><stop offset="0.5" stop-color="#3f7fa8"/><stop offset="1" stop-color="#ffdd77"/>
    </linearGradient>
  </defs>
  <rect width="900" height="458" fill="#ffffff"/>

  <!-- ═══ 패널 1: 입력 ═══ -->
  <g class="t">
    <rect x="24" y="44" width="186" height="226" rx="6" fill="#fdfdfe" stroke="#ccd4de"/>
    <text x="36" y="63" class="ph">① 입력</text>
    <g transform="translate(36,72)">
      <rect width="162" height="110" fill="#23282f"/>
      <polygon points="-4.1,12.6 8.1,-0.6 76.0,69.8 72.0,74.2" fill="#ffffff"/>
      <polygon points="148.5,19.6 159.5,28.4 101.96,93.6 98.04,90.4" fill="#ffffff"/>
      <rect x="0" y="0" width="76" height="75" fill="none" stroke="#c4763a" stroke-dasharray="3 2"/>
      <rect x="98" y="19.6" width="61.5" height="74" fill="none" stroke="#c4763a" stroke-dasharray="3 2"/>
      <circle cx="74" cy="72" r="4" fill="#2f6f9f" stroke="#ffffff" stroke-width="1.2"/>
      <circle cx="100" cy="92" r="4" fill="#2f6f9f" stroke="#ffffff" stroke-width="1.2"/>
      <text x="6" y="105" class="ax" fill="#7c8794">배경 = 0</text>
    </g>
    <text x="36" y="198" class="pn">이진 분할 마스크 (0 / 255)</text>
    <text x="36" y="213" class="pn"><tspan fill="#2f6f9f">●</tspan> 팁 좌표 &#160; <tspan fill="#c4763a">▭</tspan> 바운딩 박스</text>
    <text x="36" y="228" class="pn">마스크에는 도구 구분 정보가 없다</text>
  </g>
  <line x1="214" y1="127" x2="242" y2="127" stroke="#8b95a3" stroke-width="1.4" marker-end="url(#g-ar)"/>

  <!-- ═══ 패널 2: 연결요소 라벨링 ═══ -->
  <g class="t">
    <rect x="246" y="44" width="186" height="226" rx="6" fill="#fdfdfe" stroke="#ccd4de"/>
    <text x="258" y="63" class="ph">② 연결요소 라벨링</text>
    <g transform="translate(258,72)">
      <rect width="162" height="110" fill="#eef1f5"/>
      <polygon points="8.1,-0.6 -4.1,12.6 37.8,46.5 45.4,38.1" fill="#4f8fbf"/>
      <polygon points="50.2,43.0 43.0,50.8 72.0,74.2 76.0,69.8" fill="#7fb2d4"/>
      <polygon points="148.5,19.6 159.5,28.4 101.96,93.6 98.04,90.4" fill="#c4763a"/>
      <line x1="58" y1="11" x2="30" y2="15" stroke="#4f8fbf" stroke-width="1"/>
      <rect x="58" y="4" width="30" height="14" rx="3" fill="#4f8fbf"/>
      <text x="73" y="14.5" class="cc" text-anchor="middle">CC1</text>
      <line x1="50" y1="91" x2="66" y2="76" stroke="#7fb2d4" stroke-width="1"/>
      <rect x="20" y="84" width="30" height="14" rx="3" fill="#7fb2d4"/>
      <text x="35" y="94.5" class="cc" text-anchor="middle">CC2</text>
      <line x1="130" y1="27" x2="144" y2="36" stroke="#c4763a" stroke-width="1"/>
      <rect x="100" y="20" width="30" height="14" rx="3" fill="#c4763a"/>
      <text x="115" y="30.5" class="cc" text-anchor="middle">CC3</text>
      <path d="M40 44 Q47 40 50 45" fill="none" stroke="#ac4b45" stroke-width="1.2"/>
      <text x="8" y="107" class="ax" fill="#ac4b45">노이즈로 도구 1개가 CC 2개로 쪼개짐</text>
    </g>
    <text x="258" y="198" class="pn">마스크 &gt; 0 영역의 연결요소를 라벨링</text>
    <text x="258" y="213" class="pn">도구 1개가 여러 CC로 나뉠 수 있으므로</text>
    <text x="258" y="228" class="pn">CC 수 ≠ 도구 수</text>
  </g>
  <line x1="436" y1="127" x2="464" y2="127" stroke="#8b95a3" stroke-width="1.4" marker-end="url(#g-ar)"/>

  <!-- ═══ 패널 3: CC ↔ 어노테이션 매칭 ═══ -->
  <g class="t">
    <rect x="468" y="44" width="186" height="226" rx="6" fill="#fdfdfe" stroke="#ccd4de"/>
    <text x="480" y="63" class="ph">③ CC ↔ 어노테이션 매칭</text>
    <g transform="translate(480,72)">
      <rect width="162" height="110" fill="#eef1f5"/>
      <polygon points="8.1,-0.6 -4.1,12.6 37.8,46.5 45.4,38.1" fill="#b9c6d4"/>
      <polygon points="50.2,43.0 43.0,50.8 72.0,74.2 76.0,69.8" fill="#b9c6d4"/>
      <polygon points="148.5,19.6 159.5,28.4 101.96,93.6 98.04,90.4" fill="#e0cbb6"/>
      <rect x="0" y="0" width="76" height="75" fill="none" stroke="#2f6f9f" stroke-width="1.6"/>
      <rect x="98" y="19.6" width="61.5" height="74" fill="none" stroke="#c4763a" stroke-width="1.6"/>
      <circle cx="60" cy="14" r="9" fill="#2f6f9f"/><text x="60" y="17.5" class="cc" text-anchor="middle">A</text>
      <circle cx="146" cy="80" r="9" fill="#c4763a"/><text x="146" y="83.5" class="cc" text-anchor="middle">B</text>
      <line x1="22" y1="20" x2="50" y2="15" stroke="#17202e" stroke-width="1" marker-end="url(#g-arw)"/>
      <line x1="58" y1="58" x2="59" y2="25" stroke="#17202e" stroke-width="1" marker-end="url(#g-arw)"/>
      <line x1="126" y1="60" x2="139" y2="74" stroke="#17202e" stroke-width="1" marker-end="url(#g-arw)"/>
      <text x="4" y="105" class="ax">CC1·CC2 → A &#160;/&#160; CC3 → B</text>
    </g>
    <text x="480" y="198" class="pn">bbox와 겹치는 화소 수가 최대인</text>
    <text x="480" y="213" class="pn">어노테이션에 각 CC를 배정</text>
    <text x="480" y="228" class="pn">(겹침이 0이면 무게중심 최근접 팁)</text>
  </g>
  <line x1="658" y1="127" x2="686" y2="127" stroke="#8b95a3" stroke-width="1.4" marker-end="url(#g-ar)"/>

  <!-- ═══ 패널 4: 거리 기반 히트맵 ═══ -->
  <g class="t">
    <rect x="690" y="44" width="186" height="226" rx="6" fill="#fdfdfe" stroke="#ccd4de"/>
    <text x="702" y="63" class="ph">④ 거리 기반 히트맵</text>
    <g transform="translate(702,72)">
      <rect width="162" height="110" fill="#1b2028"/>
      <polygon points="8.1,-0.6 -4.1,12.6 37.8,46.5 45.4,38.1" fill="url(#hmA)" stroke="#46525f" stroke-width="0.8"/>
      <polygon points="50.2,43.0 43.0,50.8 72.0,74.2 76.0,69.8" fill="url(#hmA)" stroke="#46525f" stroke-width="0.8"/>
      <polygon points="148.5,19.6 159.5,28.4 101.96,93.6 98.04,90.4" fill="url(#hmB)" stroke="#46525f" stroke-width="0.8"/>
      <!-- 값 = 0.5 등고선 (그룹 내 최대 거리의 절반 지점) -->
      <line x1="26" y1="53" x2="44" y2="31" stroke="#ffffff" stroke-width="1.3" stroke-dasharray="3 2"/>
      <line x1="116" y1="65" x2="132" y2="47" stroke="#ffffff" stroke-width="1.3" stroke-dasharray="3 2"/>
      <text x="4" y="70" class="ax" fill="#ffffff">0.5</text>
      <circle cx="74" cy="72" r="2.6" fill="#ffffff"/>
      <circle cx="100" cy="92" r="2.6" fill="#ffffff"/>
      <text x="78" y="86" class="ax" fill="#ffdd77">1.0</text>
    </g>
    <text x="702" y="198" class="pn">어노테이션별 <tspan font-weight="700">독립</tspan> 정규화 —</text>
    <text x="702" y="213" class="pn">각 도구가 자기 영역 안에서 1.0을 가짐</text>
    <text x="702" y="228" class="pn">흰 점선 = 값 0.5 등고선</text>
    <rect x="702" y="238" width="120" height="10" fill="url(#cbar)" stroke="#ccd4de"/>
    <text x="702" y="259" class="ax">0.0</text><text x="756" y="259" class="ax">0.5</text><text x="808" y="259" class="ax">1.0</text>
  </g>

  <!-- ═══ 하단: 수식과 성질 ═══ -->
  <g class="t">
    <rect x="24" y="290" width="418" height="146" rx="6" fill="#f5f7fa" stroke="#ccd4de"/>
    <text x="40" y="312" class="ph">정규화 규칙</text>
    <text x="40" y="342" class="m" font-size="13" fill="#17202e">target(p) = 1 &#8722; ‖p &#8722; t&#8336;‖ / max ‖q &#8722; t&#8336;‖</text>
    <text x="40" y="358" class="pn"><tspan class="m">a</tspan> = 화소 <tspan class="m">p</tspan>가 속한 CC에 매칭된 어노테이션, <tspan class="m">t&#8336;</tspan> = 그 팁,</text>
    <text x="40" y="373" class="pn"><tspan class="m">q</tspan> = <tspan class="m">a</tspan>에 매칭된 모든 CC의 화소 (그룹 <tspan class="m">M&#8336;</tspan>)</text>
    <line x1="40" y1="384" x2="426" y2="384" stroke="#ccd4de"/>
    <text x="40" y="401" class="pn">팁 화소 → <tspan font-weight="700">1.0</tspan> &#160;·&#160; 그룹 내 최원 화소 → <tspan font-weight="700">0.0</tspan> &#160;·&#160; 사이는 선형</text>
    <text x="40" y="418" class="pn">마스크 외부 배경 → 0.0 &#160;·&#160; 도구 없는 프레임 → 전체 0.0</text>
  </g>

  <g class="t">
    <rect x="458" y="290" width="418" height="146" rx="6" fill="#f8e7d6" stroke="#c4763a"/>
    <text x="474" y="312" class="ph" fill="#a45f28">이 형태가 만드는 두 가지 결과</text>
    <text x="474" y="337" class="pn" fill="#17202e"><tspan font-weight="700">값 ≥ 0.5 영역 = 도구 몸통 중 팁에 가까운 절반.</tspan> 가우시안</text>
    <text x="474" y="352" class="pn" fill="#17202e">타겟의 반경 17.7 px 원판보다 훨씬 넓다 → 임계값 0.5에서</text>
    <text x="474" y="367" class="pn" fill="#17202e">argmax가 팁에서 멀어질 수 있다 (정밀도 ↓, miss율 ↓, §6.3).</text>
    <line x1="474" y1="378" x2="860" y2="378" stroke="#dcbb98"/>
    <text x="474" y="395" class="pn" fill="#17202e"><tspan font-weight="700">레이블 3종이 모두 필요하다</tspan> — 팁 좌표 + 분할 마스크 + bbox.</text>
    <text x="474" y="412" class="pn" fill="#17202e">마스크 품질에 이중으로 의존한다(§2.3). <tspan class="m" font-size="10">gaussian-tip</tspan>은</text>
    <text x="474" y="427" class="pn" fill="#17202e">팁 좌표 하나만 쓴다.</text>
  </g>
</svg>
