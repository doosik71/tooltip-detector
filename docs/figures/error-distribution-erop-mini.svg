  <text x="205.6" y="80" class="t val">3.47</text>
  <rect x="166" y="87" width="56.6" height="14" fill="#2f6f9f" stroke="#2f6f9f" stroke-dasharray="3 2" fill-opacity="0.45"/>
  <text x="228.6" y="98" class="t val">5.85</text>
  <line x1="24" y1="104" x2="766" y2="104" stroke="#ccd4de" stroke-dasharray="4 3"/>
