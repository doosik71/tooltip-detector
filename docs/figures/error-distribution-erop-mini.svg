<svg xmlns="http://www.w3.org/2000/svg" width="900" height="522" viewBox="0 0 900 522" role="img" aria-label="erop 데이터셋 경량 모델의 gradient-seg 대 gaussian-tip 오차 거리 분포 비교">
  <style>
    .t{font-family:'Noto Sans CJK KR','NanumGothic','Noto Sans CJK JP',sans-serif}
