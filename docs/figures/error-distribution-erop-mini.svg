  <rect x="24" y="458" width="852" height="48" rx="6" fill="#f5f7fa" stroke="#ccd4de"/>
  <text x="40" y="478" class="t note"><tspan font-weight="700" fill="#2f6f9f">gaussian-tip</tspan>은 전체 GT 팁의 <tspan font-weight="700">59.4 %를 5 px 이내</tspan>로 맞혀 봉우리가 0–5 px에 서고, 10 px 이내 누적은 73.2 %다.</text>
  <text x="40" y="496" class="t note"><tspan font-weight="700" fill="#c4763a">gradient-seg</tspan>는 5 px 이내가 7.2 %뿐이고 봉우리가 5–10 px로 밀려 10 px 이내 누적이 40.0 %다. 대신 미탐지가 3.47 % 대 5.85 %로 더 낮다 — <tspan font-weight="700">두 방식은 오차의 종류가 다르다.</tspan></text>
</svg>