  <text x="40" y="532" class="t note"><tspan font-weight="700">이득은 전부 재현율에서 나온다.</tspan> <tspan class="m" font-size="10">gradient-seg</tspan>는 정밀도·재현율이 함께 올라 순이득이지만, <tspan class="m" font-size="10">gaussian-tip</tspan>은 정밀도를 3.8–4.2 %p 내주고 재현율을 1.6–4.2 %p 얻는 교환이다.</text>
  <text x="40" y="547" class="t note">F1 이득이 <tspan class="m" font-size="10">gaussian-tip</tspan>에서 작은(+0.004 / +0.009) 이유가 여기 있다. 반면 P90 거리는 네 조합 모두 15–33 % 줄어 꼬리가 눈에 띄게 짧아졌다.</text>
