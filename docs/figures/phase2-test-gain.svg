  <text x="40" y="532" class="t note"><tspan font-weight="700">두 타겟이 서로 다른 방식으로 이득을 얻는다.&#160;</tspan><tspan class="m" font-size="10">gradient-seg</tspan>는 정밀도(+4.1 / +2.9 %p)와 재현율(+1.1 / +1.4 %p)이 함께 올라 순이득이고, <tspan class="m" font-size="10">gaussian-tip</tspan>은 정밀도를 1.3〜1.8 %p 내주고</text>
